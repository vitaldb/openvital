[build-system]
requires = ["setuptools"]

[project]
name = "openvital"
version = "0.3.0"
description = "Open-source Python library for biosignal analysis (ECG, ABP, PPG, capnography, EEG, NIRS, ...) — successor to pyvital, expanding beyond ECG."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    {name = "VitalLab", email = "vital@snu.ac.kr"}
]
keywords = [
    "biosignal",
    "vital-signs",
    "ecg",
    "abp",
    "ppg",
    "capnography",
    "eeg",
    "nirs",
    "signal-processing",
    "medical",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
# Required deps: numpy + openecg (which itself is numpy-only). The HTTP
# filter server (`python -m openvital`) uses stdlib `http.server` since 0.3.0
# — sanic is no longer required. Heavier deps live in optional extras —
# install only what your filter modules need.
dependencies = [
    "numpy",
    "openecg>=0.3.2",
]

[project.optional-dependencies]
# Required by abp_hpi, abp_ppv, pleth_*, resp_compliance, sv_dlapco etc.
# (anything that uses scipy.signal or band_pass/detect_peaks).
signal = ["scipy"]
# ecg_classifier (rhythm + beat classification with model_rhythm.h5).
ml-tf = ["tensorflow>=2.6", "keras"]
# ecg_beat_noise_detector (UniMSNet.pth).
ml-torch = ["torch"]
# Everything (including all ML backbones).
all = ["scipy", "tensorflow>=2.6", "keras", "torch"]

[project.urls]
Homepage = "https://github.com/vitaldb/openvital"
Repository = "https://github.com/vitaldb/openvital"

[tool.setuptools]
packages = ["openvital", "openvital.filters"]

[tool.setuptools.package-data]
"openvital.filters" = ["*.h5", "*.pth"]
